"""
Docker Compose configuration for local development.
"""

version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: fitness_coach_db
    environment:
      POSTGRES_USER: fitness_user
      POSTGRES_PASSWORD: fitness_password
      POSTGRES_DB: fitness_coach
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fitness_user"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: fitness_coach_cache
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fitness_coach_api
    environment:
      DATABASE_URL: postgresql://fitness_user:fitness_password@postgres:5432/fitness_coach
      REDIS_URL: redis://redis:6379/0
      DEBUG: "True"
      ENVIRONMENT: development
      SECRET_KEY: dev-secret-key-change-in-production
      AWS_REGION: us-east-1
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - .:/app
    command: python main.py

volumes:
  postgres_data:

networks:
  default:
    name: fitness_coach_network
